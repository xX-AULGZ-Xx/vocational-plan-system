# ==============================================================================
# Vocational Planning & Project Management System — Docker Compose Configuration
# ==============================================================================
# ใช้ร่วมกับ MySQL ของ Host Server aaPanel (Port 3306) โดยตรง ไม่สร้าง Container DB ซ้ำซ้อน
#
# คำสั่งรัน:
#   $ docker compose up -d --build
# ==============================================================================

services:
  # 1. Backend API Service (Node.js Express + Prisma + LibreOffice + Thai Fonts)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vps-api
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 5050
      DATABASE_URL: "${DATABASE_URL:-mysql://root:rootpassword@host.docker.internal:3306/vocational_plan_db}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-chiangrai-vocational-2026}"
      CORS_ORIGIN: "http://localhost:3005,http://localhost:3000,http://web:3005"
      STORAGE_DIR: "/app/apps/api/storage"
    ports:
      - "5050:5050"
    volumes:
      - ./apps/api/storage:/app/apps/api/storage
      - ./:/app/host_config
    networks:
      - vps-network

  # 2. Frontend Web Service (Next.js 16 Standalone)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vps-web
    restart: always
    depends_on:
      - api
    environment:
      PORT: 3005
      INTERNAL_API_URL: "http://api:5050"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
    ports:
      - "3005:3005"
    volumes:
      - ./apps/api/storage:/app/apps/api/storage
      - ./:/app/host_config
    networks:
      - vps-network

networks:
  vps-network:
    driver: bridge
