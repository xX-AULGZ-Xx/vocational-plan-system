# ==============================================================================
# Vocational Planning & Project Management System — Docker Compose Configuration
# ==============================================================================
# ทำงานร่วมกับ aaPanel Host Network 100% (เข้าถึง MySQL 127.0.0.1:3306 ของเครื่องแม่ได้ทันที)
#
# คำสั่งรัน:
#   $ docker compose up -d --build
# ==============================================================================

services:
  # 1. Backend API Service (Node.js Express + Prisma + LibreOffice + Thai Fonts)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vps-api
    restart: always
    network_mode: "host"
    environment:
      PORT: 5050
      DATABASE_URL: "${DATABASE_URL:-mysql://root:rootpassword@127.0.0.1:3306/vocational_plan_db}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-chiangrai-vocational-2026}"
      CORS_ORIGIN: "http://localhost:3005,http://localhost:3000,http://127.0.0.1:3005,http://plan.cric.ac.th"
      STORAGE_DIR: "/app/apps/api/storage"
    volumes:
      - ./apps/api/storage:/app/apps/api/storage
      - ./:/app/host_config

  # 2. Frontend Web Service (Next.js 16 Standalone)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: vps-web
    restart: always
    network_mode: "host"
    environment:
      PORT: 3005
      INTERNAL_API_URL: "http://127.0.0.1:5050"
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: "${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}"
    volumes:
      - ./apps/api/storage:/app/apps/api/storage
      - ./:/app/host_config
