# ==============================================================================
# Override Docker Compose for External MySQL Server
# ==============================================================================
# ใช้เมื่อ Server ของคุณมี MySQL อยู่แล้ว (เช่น Host Port 3306 หรือ Server ภายนอก)
#
# คำสั่งรัน:
#   $ docker compose -f docker-compose.yml -f docker-compose.external-db.yml up -d --build
# ==============================================================================

services:
  # ปิดการทำงานของ MySQL Container ภายใน
  mysql:
    entrypoint: ["echo", "External MySQL is being used, skipping internal container."]
    restart: "no"
    ports: []
    profiles: ["disabled"]

  # ปรับ Backend API ให้เชื่อมต่อไปยัง MySQL ของ Host เครื่องแม่
  api:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ระบุ Connection String ไปยัง Host MySQL (Port 3306)
      DATABASE_URL: "${DATABASE_URL:-mysql://root:rootpassword@host.docker.internal:3306/vocational_plan_db}"
